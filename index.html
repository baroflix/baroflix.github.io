<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Baroflix — New Address</title>
  <meta http-equiv="refresh" content="5;url=https://baroflix.vercel.app" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #080808;
      color: #fff;
      font-family: Inter, system-ui, sans-serif;
      text-align: center;
      padding: 24px;
    }
    .card { max-width: 420px; width: 100%; }
    img {
      height: 36px;
      width: auto;
      margin: 0 auto 32px;
      display: block;
      opacity: 0.9;
    }
    h1 { font-size: 1.1rem; font-weight: 700; color: #fff; margin-bottom: 10px; }
    p { font-size: 0.875rem; color: rgba(255,255,255,0.45); line-height: 1.6; margin-bottom: 28px; }
    a.btn {
      display: inline-block;
      padding: 12px 28px;
      border-radius: 999px;
      background: #ef4444;
      color: #fff;
      font-size: 0.875rem;
      font-weight: 700;
      text-decoration: none;
      transition: opacity 0.15s;
    }
    a.btn:hover { opacity: 0.85; }
    .note { margin-top: 20px; font-size: 0.72rem; color: rgba(255,255,255,0.2); }
  </style>
</head>
<body>
  <div class="card">
    <img src="https://baroflix.vercel.app/baroflix_oneline.png" alt="Baroflix" />
    <h1>We've moved!</h1>
    <p>Baroflix has a new home.<br/>You'll be redirected automatically in a few seconds.</p>
    <a class="btn" href="https://baroflix.vercel.app">Go to Baroflix →</a>
    <p class="note">Redirecting to baroflix.vercel.app…</p>
  </div>
</body>
</html>
